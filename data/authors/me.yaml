bio: |
  王战，博士，正高级工程师，现任浙江浙能数字科技有限公司高级技术专家、浙江省浙能工业信息工程省级重点企业研究院副院长。长期从事智能机器人与自主系统、工业传感与视觉智能、能源物联网与信息技术等方向的研究与工程应用。

  曾主持或负责国家级、省部级及企业科研项目，相关成果已在火电、新能源、化工和钢铁等工业场景开展应用，具有科研团队建设、关键技术攻关、项目管理和科技成果转化经验。
