<style>
.zw-patent-feed{--pf-blue:#175cd3;--pf-ink:#17233d;--pf-muted:#58677e;--pf-line:#d8e4f5;max-width:1120px;margin:0 auto;padding:clamp(1rem,3vw,2.5rem);color:var(--pf-ink)}
.zw-patent-feed__panel{padding:clamp(1rem,3vw,2.5rem);border:1px solid var(--pf-line);border-radius:22px;background-color:#f8fbff;background-image:linear-gradient(rgba(23,92,211,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(23,92,211,.04) 1px,transparent 1px);background-size:28px 28px;box-shadow:0 18px 45px rgba(22,57,110,.1)}

.zw-patent-list{display:grid;gap:1rem}.zw-patent-card{padding:clamp(1rem,2.5vw,1.5rem);border:1px solid var(--pf-line);border-radius:17px;background:#fff;box-shadow:0 8px 22px rgba(25,72,139,.07)}.zw-patent-card[hidden]{display:none}.zw-patent-card__title{margin:0;font-size:clamp(1.15rem,2.6vw,1.45rem);line-height:1.45}.zw-patent-card__title a{color:var(--pf-ink);text-decoration:none}.zw-patent-card__title a:hover{color:var(--pf-blue)}.zw-patent-card__badges{display:flex;flex-wrap:wrap;gap:.45rem;margin:.8rem 0}.zw-patent-card__badges span{padding:.28rem .6rem;border-radius:999px;background:#e7f0ff;color:#164f9f;font-size:.78rem;font-weight:750}.zw-patent-card__meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.75rem;margin:1rem 0}.zw-patent-card__meta div{min-width:0;padding:.7rem;border-left:3px solid #80ace9;background:#f6f9fe}.zw-patent-card__meta dt,.zw-patent-card__label{font-size:.78rem;font-weight:750;color:var(--pf-muted)}.zw-patent-card__meta dd{margin:.25rem 0 0;font-weight:650}.zw-patent-card__number dd{overflow-wrap:anywhere}.zw-patent-card__inventors{line-height:1.8}.zw-patent-card__owner{padding:.08rem .28rem;border-radius:4px;background:#ffdf7a;color:#14213c}.zw-patent-card__patentees ul{display:grid;gap:.3rem;margin:.45rem 0;padding-left:1.25rem}.zw-patent-card__patentees li{overflow-wrap:anywhere}.zw-patent-card__actions{margin-top:1rem}.zw-patent-card__view{color:var(--pf-blue);font-weight:800;text-decoration:none}.zw-patent-feed__empty{padding:2rem;text-align:center;color:var(--pf-muted)}
