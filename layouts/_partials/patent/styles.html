<style>
.zw-patent-detail{--pd-blue:#175cd3;--pd-ink:#17233d;--pd-muted:#56647b;--pd-line:#d8e3f4;max-width:1120px;margin:0 auto;padding:clamp(1rem,3vw,2.5rem);color:var(--pd-ink)}
